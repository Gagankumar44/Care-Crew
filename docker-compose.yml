version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: mediar-postgres
    environment:
      POSTGRES_USER: mediar_user
      POSTGRES_PASSWORD: mediar_password
      POSTGRES_DB: mediar_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediar_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Auth Service
  auth-service:
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    container_name: mediar-auth-service
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: mediar_db
      DB_USER: mediar_user
      DB_PASSWORD: mediar_password
      JWT_SECRET: ${JWT_SECRET:-change-me-in-development}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-in-development}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3

  # AI Triage Service
  ai-triage-service:
    build:
      context: ./backend/ai-triage-service
      dockerfile: Dockerfile
    container_name: mediar-ai-triage-service
    environment:
      PORT: 3001
      GCP_PROJECT_ID: ${GCP_PROJECT_ID}
      GCP_LOCATION: ${GCP_LOCATION:-us-central1}
      HIPAA_ENCRYPTION_KEY: ${HIPAA_ENCRYPTION_KEY:-change-me}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-development}
    ports:
      - "3001:3001"
    depends_on:
      - auth-service
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
