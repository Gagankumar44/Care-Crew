name: mediar
description: MediAR - AI-Driven AR Telehealth Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  
  # Routing
  go_router: ^13.0.0
  
  # UI & Theming
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0
  
  # AR & Camera
  arkit_plugin: ^1.4.0  # iOS ARKit
  arcore_flutter_plugin: ^0.2.0  # Android ARCore
  camera: ^0.10.5+5
  permission_handler: ^11.1.0
  
  # On-Device AI
  mediapipe_pose: ^0.1.0  # MediaPipe Pose Landmarker
  
  # Networking & API
  dio: ^5.4.0
  retrofit: ^4.0.3
  json_annotation: ^4.8.1
  
  # Local Storage & Offline-First
  sqflite: ^2.3.0
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2
  workmanager: ^0.5.2  # Background sync
  
  # Video/Audio (WebRTC)
  flutter_webrtc: ^0.9.48
  
  # Health Data Integration
  health: ^10.1.0  # HealthKit/Health Connect wrapper
  
  # Utilities
  intl: ^0.19.0
  uuid: ^4.2.1
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  json_serializable: ^6.7.1
  
  # Security & Encryption
  crypto: ^3.0.3
  encrypt: ^5.0.3
  flutter_secure_storage: ^9.0.0
  
  # Gamification
  charts_flutter: ^0.12.0  # Progress visualization
  
  # Error Handling & Logging
  logger: ^2.0.2+1
  sentry_flutter: ^7.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  freezed: ^2.4.6
  retrofit_generator: ^8.0.6
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/models/  # 3D AR models
    
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

