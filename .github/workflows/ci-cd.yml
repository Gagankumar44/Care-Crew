name: MediAR CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '18'
  FLUTTER_VERSION: '3.19.0'

jobs:
  # Backend Services Tests
  backend-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - auth-service
          - ai-triage-service
          - patient-data-service
          - webrtc-signal-service
          - rpm-data-service
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      
      - name: Install dependencies
        working-directory: ./backend/${{ matrix.service }}
        run: npm ci
      
      - name: Run linter
        working-directory: ./backend/${{ matrix.service }}
        run: npm run lint || true
      
      - name: Run tests
        working-directory: ./backend/${{ matrix.service }}
        run: npm test || true

  # Mobile App Tests
  mobile-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
      
      - name: Install dependencies
        working-directory: ./mobile
        run: flutter pub get
      
      - name: Analyze code
        working-directory: ./mobile
        run: flutter analyze
      
      - name: Run tests
        working-directory: ./mobile
        run: flutter test

  # Security Scanning
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run npm audit
        run: |
          for service in backend/*/; do
            if [ -f "$service/package.json" ]; then
              cd "$service"
              npm audit --audit-level=moderate || true
              cd ../..
            fi
          done
      
      - name: Run Flutter security check
        working-directory: ./mobile
        run: flutter pub outdated || true

  # Build Docker Images
  build-images:
    runs-on: ubuntu-latest
    needs: [backend-tests, mobile-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service:
          - auth-service
          - ai-triage-service
          - patient-data-service
          - webrtc-signal-service
          - rpm-data-service
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: gcr.io
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY }}
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend/${{ matrix.service }}
          push: true
          tags: gcr.io/${{ secrets.GCP_PROJECT_ID }}/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=registry,ref=gcr.io/${{ secrets.GCP_PROJECT_ID }}/${{ matrix.service }}:latest
          cache-to: type=inline

  # Deploy to Staging
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [build-images]
    if: github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup GCP
        uses: google-github-actions/setup-gcloud@v1
        with:
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
      
      - name: Deploy to Cloud Run (Staging)
        run: |
          # Deploy each service
          for service in auth-service ai-triage-service patient-data-service webrtc-signal-service rpm-data-service; do
            gcloud run deploy $service-staging \
              --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/$service:${{ github.sha }} \
              --region us-central1 \
              --platform managed \
              --allow-unauthenticated || true
          done

  # Deploy to Production
  deploy-production:
    runs-on: ubuntu-latest
    needs: [build-images]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://api.mediar.app
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup GCP
        uses: google-github-actions/setup-gcloud@v1
        with:
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}
      
      - name: Deploy to Cloud Run (Production)
        run: |
          # Deploy each service
          for service in auth-service ai-triage-service patient-data-service webrtc-signal-service rpm-data-service; do
            gcloud run deploy $service \
              --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/$service:${{ github.sha }} \
              --region us-central1 \
              --platform managed \
              --allow-unauthenticated || true
          done

